# Build de « YouThibz » : notre tweak YouThibz + briques open source, compilé sous Linux
# (10x moins cher en minutes GitHub que macOS), puis injecté dans l'IPA de la release « ios-source ».
name: YouThibz

on:
  push:
    branches: [main]
    paths:
      - "tweak-ios/**"
      - "scripts/**"
      - ".github/actions/theos-linux/**"
      - ".github/workflows/youthibz.yml"
  schedule:
    - cron: "41 6 * * 1" # chaque lundi ; ne reconstruit que si l'IPA ou le tweak a changé
  workflow_dispatch:
    inputs:
      force:
        description: "Reconstruire même si rien n'a changé"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: youthibz
  cancel-in-progress: true

env:
  APP_NAME: "YouThibz"
  # Bundle ID distinct pour installer « YouThibz » à côté de l'app uYouEnhanced.
  BUNDLE_ID: com.google.ios.youtube.youthibz
  # SDK « patché » de Theos : les SDK récents (17+) sont incompatibles avec la toolchain Linux (clang 11).
  # Sans effet sur la compatibilité : le tweak tourne sur iOS 26.
  SDK_VERSION: "16.5"
  KEEP_RELEASES: 1

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v6
        with:
          path: repo
          fetch-depth: 0

      - name: Quelque chose a changé ?
        id: check
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          src=$(scripts/ios_source.sh info)
          tweak=$(git log -1 --format=%h -- tweak-ios .github/workflows/youthibz.yml)
          tag="build-ios-youthibz-$(printf '%s' "$src" | sha256sum | cut -c1-8)-${tweak}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tweak=$tweak" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ] || [ "$GITHUB_EVENT_NAME" = "push" ] || ! gh release view "$tag" >/dev/null 2>&1; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Déjà construit ($tag)."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Theos sous Linux
        if: steps.check.outputs.should_build == 'true'
        uses: ./repo/.github/actions/theos-linux
        with:
          sdk-version: ${{ env.SDK_VERSION }}

      - name: Compiler YouThibz et les briques
        if: steps.check.outputs.should_build == 'true'
        run: repo/tweak-ios/build.sh

      - name: Récupérer et vérifier l'IPA
        if: steps.check.outputs.should_build == 'true'
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ios_source.sh download "$RUNNER_TEMP/YouTube.ipa"
          python3 scripts/verify_ipa.py "$RUNNER_TEMP/YouTube.ipa"

      # Rapport : chaque classe / méthode modifiée par les tweaks existe-t-elle encore dans cette version de YouTube ?
      - name: Vérifier la compatibilité des hooks
        if: steps.check.outputs.should_build == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sources=("YouThibz (code maison)=repo/tweak-ios/Sources")
          while read -r name repo sha; do
            [[ -z "$name" || "$name" == \#* || "$name" == YouTubeHeader || "$name" == PSHeader ]] && continue
            sources+=("$name=repo/tweak-ios/build/vendor/$name")
          done < repo/tweak-ios/vendor.lock
          repo/scripts/hooks_report.sh "$RUNNER_TEMP/YouTube.ipa" "$RUNNER_TEMP/hooks.md" "${sources[@]}"
          cat "$RUNNER_TEMP/hooks.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Injecter dans l'IPA
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          YT_VERSION=$(unzip -p "$RUNNER_TEMP/YouTube.ipa" Payload/YouTube.app/Info.plist \
            | python3 -c 'import plistlib,sys; print(plistlib.loads(sys.stdin.buffer.read())["CFBundleShortVersionString"])')
          OUT="YouThibz_${YT_VERSION}.ipa"
          cyan -i "$RUNNER_TEMP/YouTube.ipa" -o "$OUT" -uwef repo/tweak-ios/build/debs/*.deb -n "$APP_NAME" -b "$BUNDLE_ID" \
            -l repo/tweak-ios/Info-extra.plist
          # Retirer les extensions non re-signables (hors PlugIns/).
          bad=$(unzip -Z1 "$OUT" | grep '\.appex/' | sed 's|^\(.*\.appex\)/.*|\1|' | sort -u | grep -v '/PlugIns/' || true)
          [ -z "$bad" ] || printf '%s\n' "$bad" | while IFS= read -r d; do zip -q -d "$OUT" "${d}/*" || true; done
          # Les briques ne se chargent plus d'office : YouThibz les charge selon ses réglages
          # (Réglages > YouThibz > Brique : …), pour pouvoir isoler celle qui pose problème.
          work="$RUNNER_TEMP/strip" && rm -rf "$work" && mkdir -p "$work"
          (cd "$work" && unzip -q "$GITHUB_WORKSPACE/$OUT" Payload/YouTube.app/YouTube)
          bin="$work/Payload/YouTube.app/YouTube"
          ldid -e "$bin" > "$work/ent.plist"
          mods=$(for d in repo/tweak-ios/build/debs/*.deb; do dpkg-deb -c "$d"; done \
            | grep -o '[^/]*\.dylib$' | grep -vx 'YouThibz.dylib' | sort -u | sed 's|^|@rpath/|')
          echo "Briques chargées par YouThibz :" $mods
          python3 repo/scripts/strip_load_commands.py "$bin" $mods
          if [ -s "$work/ent.plist" ]; then ldid -S"$work/ent.plist" -M "$bin"; else ldid -S -M "$bin"; fi
          (cd "$work" && zip -q "$GITHUB_WORKSPACE/$OUT" Payload/YouTube.app/YouTube)
          # Contrôle : YouThibz toujours chargé, les briques non.
          unzip -p "$OUT" Payload/YouTube.app/YouTube > "$work/check"
          python3 - "$work/check" $mods <<'PY'
          import sys
          sys.path.insert(0, "repo/scripts")
          from verify_ipa import parse_macho
          libs = parse_macho(open(sys.argv[1], "rb").read())[1]
          print("Chargés au lancement (@rpath) :", [l for l in libs if l.startswith("@rpath/")])
          assert "@rpath/YouThibz.dylib" in libs, "YouThibz n'est plus chargé !"
          left = sorted(set(libs) & set(sys.argv[2:]))
          assert not left, f"briques encore chargées d'office : {left}"
          PY
          echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - name: Publier
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
          TWEAK: ${{ steps.check.outputs.tweak }}
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "## YouTube ${YT_VERSION} + YouThibz (\`${TWEAK}\`)"
            echo
            echo "App **« ${APP_NAME} »** (\`${BUNDLE_ID}\`) : s'installe à côté de l'app uYouEnhanced."
            echo
            echo "Briques incluses :"
            grep -v '^#' tweak-ios/vendor.lock | awk 'NF==3 {printf "- %s — [%s@%s](https://github.com/%s/commit/%s)\n", $1, $2, substr($3,1,7), $2, $3}'
            echo "- YouThibz (code maison) — masquer les Shorts, qualité par défaut (Wi-Fi 1080p / mobile 720p par défaut), bouton Télécharger (vidéo → Photos, audio → Fichiers), réglages dans YouTube > Réglages > YouThibz"
            echo
            echo "IPA **non signée** : à installer avec iLoader (ou Sideloadly) et votre compte Apple. Chaque brique peut être désactivée dans Réglages > YouThibz."
            if [ -f "$RUNNER_TEMP/hooks.md" ]; then
              echo
              echo "<details><summary>Compatibilité des hooks</summary>"
              echo
              cat "$RUNNER_TEMP/hooks.md"
              echo
              echo "</details>"
            fi
          } > notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "../$OUT" --title "YouThibz ${TWEAK} — YouTube ${YT_VERSION}" \
            --notes-file notes.md --latest=false
          gh release list --limit 100 --json tagName,publishedAt \
            -q '[.[] | select(.tagName | startswith("build-ios-youthibz-"))] | map(select(.tagName != env.TAG)) | sort_by(.publishedAt) | reverse | .[((env.KEEP_RELEASES|tonumber) - 1):] | .[].tagName' \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag

      - name: Paquets .deb (en cas d'échec d'injection)
        if: always() && steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: youthibz-debs
          path: repo/tweak-ios/build/debs/*.deb
          if-no-files-found: ignore
          retention-days: 7
