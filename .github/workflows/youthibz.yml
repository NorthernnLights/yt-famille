# Build de « YouThibz » : notre tweak YouThibz + briques open source, compilé sous Linux
# (10x moins cher en minutes GitHub que macOS), puis injecté dans l'IPA de la release « ios-source ».
name: YouThibz

on:
  push:
    branches: [main]
    paths:
      - "tweak-ios/**"
      - ".github/workflows/youthibz.yml"
  schedule:
    - cron: "41 6 * * 1" # chaque lundi ; ne reconstruit que si l'IPA ou le tweak a changé
  workflow_dispatch:
    inputs:
      force:
        description: "Reconstruire même si rien n'a changé"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: youthibz
  cancel-in-progress: true

env:
  APP_NAME: "YouThibz"
  # Bundle ID distinct pour installer « YouThibz » à côté de l'app uYouEnhanced.
  BUNDLE_ID: com.google.ios.youtube.youthibz
  # SDK « patché » de Theos : les SDK récents (17+) sont incompatibles avec la toolchain Linux (clang 11).
  # Sans effet sur la compatibilité : le tweak tourne sur iOS 26.
  SDK_VERSION: "16.5"
  KEEP_RELEASES: 3

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v6
        with:
          path: repo
          fetch-depth: 0

      - name: Quelque chose a changé ?
        id: check
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          src=$(scripts/ios_source.sh info)
          tweak=$(git log -1 --format=%h -- tweak-ios .github/workflows/youthibz.yml)
          tag="build-ios-youthibz-$(printf '%s' "$src" | sha256sum | cut -c1-8)-${tweak}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tweak=$tweak" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ] || [ "$GITHUB_EVENT_NAME" = "push" ] || ! gh release view "$tag" >/dev/null 2>&1; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Déjà construit ($tag)."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dépendances
        if: steps.check.outputs.should_build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot rsync perl libxml2 libncurses6 zip unzip pipx >/dev/null
          # La toolchain iOS cherche libtinfo.so.5, absente des Ubuntu récents.
          lib=$(ls /usr/lib/x86_64-linux-gnu/libtinfo.so.6* | head -1)
          sudo ln -sf "$lib" /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      - name: Theos
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Toolchain iOS et ldid
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$THEOS/toolchain"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$THEOS/toolchain"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -1
          sudo curl -fsSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          ldid 2>&1 | head -1 || true

      - name: Cache du SDK iOS
        if: steps.check.outputs.should_build == 'true'
        id: sdk
        uses: actions/cache@v6
        with:
          path: theos/sdks/iPhoneOS${{ env.SDK_VERSION }}.sdk
          key: linux-theos-iOS-${{ env.SDK_VERSION }}-SDK

      - name: Télécharger le SDK iOS
        if: steps.check.outputs.should_build == 'true' && steps.sdk.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$THEOS/sdks"
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/ "$RUNNER_TEMP/sdks-src"
          cd "$RUNNER_TEMP/sdks-src"
          git sparse-checkout set --no-cone "iPhoneOS${SDK_VERSION}.sdk"
          git checkout
          mv "iPhoneOS${SDK_VERSION}.sdk" "$THEOS/sdks/"

      - name: Compiler YouThibz et les briques
        if: steps.check.outputs.should_build == 'true'
        run: repo/tweak-ios/build.sh

      - name: Récupérer et vérifier l'IPA
        if: steps.check.outputs.should_build == 'true'
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ios_source.sh download "$RUNNER_TEMP/YouTube.ipa"
          python3 scripts/verify_ipa.py "$RUNNER_TEMP/YouTube.ipa"

      # Rapport : chaque classe / méthode modifiée par les tweaks existe-t-elle encore dans cette version de YouTube ?
      - name: Vérifier la compatibilité des hooks
        if: steps.check.outputs.should_build == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download -R blacktop/ipsw -p 'ipsw_*_linux_x86_64.tar.gz' -D "$RUNNER_TEMP/ipsw"
          tar -xzf "$RUNNER_TEMP"/ipsw/*.tar.gz -C "$RUNNER_TEMP/ipsw"
          IPSW=$(find "$RUNNER_TEMP/ipsw" -type f -name ipsw | head -1)
          rm -rf "$RUNNER_TEMP/yt" && mkdir -p "$RUNNER_TEMP/yt" "$RUNNER_TEMP/dumps"
          unzip -q "$RUNNER_TEMP/YouTube.ipa" -d "$RUNNER_TEMP/yt"
          APP=$(ls -d "$RUNNER_TEMP"/yt/Payload/*.app)
          EXE=$(python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1],"rb"))["CFBundleExecutable"])' "$APP/Info.plist")
          VERSION=$(python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1],"rb"))["CFBundleShortVersionString"])' "$APP/Info.plist")
          { echo "$APP/$EXE"; for fw in "$APP"/Frameworks/*.framework; do n=$(basename "$fw" .framework); [ -f "$fw/$n" ] && echo "$fw/$n" || true; done; } \
            | while read -r bin; do
                "$IPSW" class-dump "$bin" > "$RUNNER_TEMP/dumps/$(basename "$bin").txt" 2>/dev/null || echo "(ignoré : $(basename "$bin"))"
              done
          args=()
          for d in "$RUNNER_TEMP"/dumps/*.txt; do args+=(--dump "$d"); done
          args+=(--source "YouThibz (code maison)=repo/tweak-ios/Sources")
          while read -r name repo sha; do
            [[ -z "$name" || "$name" == \#* || "$name" == YouTubeHeader || "$name" == PSHeader ]] && continue
            args+=(--source "$name=repo/tweak-ios/build/vendor/$name")
          done < repo/tweak-ios/vendor.lock
          python3 repo/scripts/check_hooks.py "${args[@]}" --version "$VERSION" --report "$RUNNER_TEMP/hooks.md"
          cat "$RUNNER_TEMP/hooks.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Injecter dans l'IPA
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          YT_VERSION=$(unzip -p "$RUNNER_TEMP/YouTube.ipa" Payload/YouTube.app/Info.plist \
            | python3 -c 'import plistlib,sys; print(plistlib.loads(sys.stdin.buffer.read())["CFBundleShortVersionString"])')
          OUT="YouThibz_${YT_VERSION}.ipa"
          cyan -i "$RUNNER_TEMP/YouTube.ipa" -o "$OUT" -uwef repo/tweak-ios/build/debs/*.deb -n "$APP_NAME" -b "$BUNDLE_ID"
          # Retirer les extensions non re-signables (hors PlugIns/).
          bad=$(unzip -Z1 "$OUT" | grep '\.appex/' | sed 's|^\(.*\.appex\)/.*|\1|' | sort -u | grep -v '/PlugIns/' || true)
          [ -z "$bad" ] || printf '%s\n' "$bad" | while IFS= read -r d; do zip -q -d "$OUT" "${d}/*" || true; done
          echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - name: Publier
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
          TWEAK: ${{ steps.check.outputs.tweak }}
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "## YouTube ${YT_VERSION} + YouThibz (\`${TWEAK}\`)"
            echo
            echo "App **« ${APP_NAME} »** (\`${BUNDLE_ID}\`) : s'installe à côté de l'app uYouEnhanced."
            echo
            echo "Briques incluses :"
            grep -v '^#' tweak-ios/vendor.lock | awk 'NF==3 {printf "- %s — [%s@%s](https://github.com/%s/commit/%s)\n", $1, $2, substr($3,1,7), $2, $3}'
            echo "- YouThibz (code maison) — masquer les Shorts, qualité par défaut (Wi-Fi 1080p / mobile 720p)"
            echo
            echo "IPA **non signée** : à installer avec Sideloadly et votre compte développeur Apple."
            if [ -f "$RUNNER_TEMP/hooks.md" ]; then
              echo
              echo "<details><summary>Compatibilité des hooks</summary>"
              echo
              cat "$RUNNER_TEMP/hooks.md"
              echo
              echo "</details>"
            fi
          } > notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "../$OUT" --title "YouThibz ${TWEAK} — YouTube ${YT_VERSION}" \
            --notes-file notes.md --latest=false
          gh release list --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("build-ios-youthibz-"))] | sort_by(.createdAt) | reverse | .[(env.KEEP_RELEASES|tonumber):] | .[].tagName' \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag

      - name: Paquets .deb (en cas d'échec d'injection)
        if: always() && steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: youthibz-debs
          path: repo/tweak-ios/build/debs/*.deb
          if-no-files-found: ignore
          retention-days: 7
