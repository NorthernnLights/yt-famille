# YouTube Music iOS : YTMusicUltimate (GPL-3) compilé sous Linux et injecté dans l'IPA
# déchiffrée de la release « ytmusic-source ».
name: YouTube Music iOS

on:
  push:
    branches: [main]
    paths:
      - "ytmusic-ios/**"
      - "scripts/**"
      - ".github/actions/theos-linux/**"
      - ".github/workflows/ytmusic-ios.yml"
  schedule:
    - cron: "53 6 * * 1" # chaque lundi ; ne reconstruit que si l'IPA ou le tweak a changé
  workflow_dispatch:
    inputs:
      force:
        description: "Reconstruire même si rien n'a changé"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ytmusic-ios
  cancel-in-progress: true

env:
  SOURCE_NAME: ytmusic-source
  EXPECTED_BUNDLE: com.google.ios.youtubemusic
  KEEP_RELEASES: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: repo
          fetch-depth: 0

      - name: Quelque chose a changé ?
        id: check
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          if ! src=$(scripts/ios_source.sh info 2>/dev/null); then
            echo "::warning::Pas encore d'IPA YouTube Music : créez une release (brouillon accepté) nommée « ytmusic-source » et joignez-y l'IPA déchiffrée."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r _ repo sha < <(grep -v '^#' ytmusic-ios/vendor.lock | awk 'NF==3')
          commit=$(git log -1 --format=%h -- ytmusic-ios .github/workflows/ytmusic-ios.yml)
          tag="build-ytmusic-ios-$(printf '%s' "$src" | sha256sum | cut -c1-8)-${sha:0:7}-${commit}"
          { echo "tag=$tag"; echo "repo=$repo"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ] || [ "$GITHUB_EVENT_NAME" = "push" ] || ! gh release view "$tag" >/dev/null 2>&1; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Déjà construit ($tag)."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Theos sous Linux
        if: steps.check.outputs.should_build == 'true'
        uses: ./repo/.github/actions/theos-linux

      - name: Compiler YTMusicUltimate
        if: steps.check.outputs.should_build == 'true'
        env:
          REPO: ${{ steps.check.outputs.repo }}
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir ytmu && cd ytmu
          git init -q && git remote add origin "https://github.com/$REPO"
          git fetch -q --depth 1 origin "$SHA" && git checkout -q FETCH_HEAD
          git submodule update -q --init --recursive --depth 1
          # SIDELOADING=1 : correctif de connexion au compte Google pour les apps installées hors App Store.
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless SIDELOADING=1
          ls -l packages/

      - name: Récupérer et vérifier l'IPA
        if: steps.check.outputs.should_build == 'true'
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ios_source.sh download "$RUNNER_TEMP/YouTubeMusic.ipa"
          python3 scripts/verify_ipa.py "$RUNNER_TEMP/YouTubeMusic.ipa" "$EXPECTED_BUNDLE"

      - name: Vérifier la compatibilité des hooks
        if: steps.check.outputs.should_build == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo/scripts/hooks_report.sh "$RUNNER_TEMP/YouTubeMusic.ipa" "$RUNNER_TEMP/hooks.md" "YTMusicUltimate=ytmu/Source"
          cat "$RUNNER_TEMP/hooks.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Injecter dans l'IPA
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          VERSION=$(python3 - "$RUNNER_TEMP/YouTubeMusic.ipa" <<'PY'
          import plistlib, re, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          name = next(n for n in z.namelist() if re.fullmatch(r"Payload/[^/]+\.app/Info\.plist", n))
          print(plistlib.loads(z.read(name))["CFBundleShortVersionString"])
          PY
          )
          OUT="YouTubeMusic_${VERSION}_YTMusicUltimate.ipa"
          cyan -i "$RUNNER_TEMP/YouTubeMusic.ipa" -o "$OUT" -uwef ytmu/packages/*.deb
          bad=$(unzip -Z1 "$OUT" | grep '\.appex/' | sed 's|^\(.*\.appex\)/.*|\1|' | sort -u | grep -v '/PlugIns/' || true)
          [ -z "$bad" ] || printf '%s\n' "$bad" | while IFS= read -r d; do zip -q -d "$OUT" "${d}/*" || true; done
          { echo "VERSION=$VERSION"; echo "OUT=$OUT"; } >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - name: Publier
        if: steps.check.outputs.should_build == 'true'
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
          REPO: ${{ steps.check.outputs.repo }}
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo "## YouTube Music ${VERSION} + YTMusicUltimate"
            echo
            echo "- Tweak : [${REPO}@${SHA:0:7}](https://github.com/${REPO}/commit/${SHA}) (GPL-3), avec le correctif de connexion pour le sideload"
            echo "- Réglages du tweak : dans l'app, Réglages > YTMusicUltimate"
            echo
            echo "IPA **non signée** : à installer avec Sideloadly et votre compte développeur Apple."
            if [ -f "$RUNNER_TEMP/hooks.md" ]; then
              echo; echo "<details><summary>Compatibilité des hooks</summary>"; echo
              cat "$RUNNER_TEMP/hooks.md"; echo; echo "</details>"
            fi
          } > notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "../$OUT" --title "YouTube Music iOS — ${VERSION} + YTMusicUltimate ${SHA:0:7}" \
            --notes-file notes.md --latest=false
          gh release list --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("build-ytmusic-ios-"))] | sort_by(.createdAt) | reverse | .[(env.KEEP_RELEASES|tonumber):] | .[].tagName' \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
