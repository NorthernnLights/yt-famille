# Configuration du build Android.
# Format : https://github.com/j-hc/revanced-magisk-module/blob/main/CONFIG.md
# Toute modification de ce fichier déclenche un nouveau build au prochain passage.

parallel-jobs = 1
enable-module-update = false

# Patchs Morphe (successeur actif de ReVanced).
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
# "latest" = dernière version stable des patchs ; "dev" = pré-versions (YouTube plus récent, moins testé).
patches-version = "latest"

[YouTube]
app-name = "YouTube"
build-mode = "apk"
# "experimental" = la version de YouTube la plus récente supportée par les patchs,
#   y compris celles que Morphe marque « expérimentales » (plus récentes, un peu moins testées).
# "auto" = la plus récente parmi les versions « stables » des patchs (souvent plusieurs mois de retard).
version = "experimental"
# Tous les téléphones Android 16 sont en arm64.
arch = "arm64-v8a"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
# Patchs à exclure, ex. : excluded-patches = "'Nom du patch' 'Autre patch'"
excluded-patches = ""
# Nom affiché « YouThibz », logo d'origine de YouTube.
patcher-args = "-e 'Custom branding' -OcustomName=YouThibz -OappIcon=original"

[Music]
app-name = "Music"
build-mode = "apk"
version = "experimental"
arch = "arm64-v8a"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"
excluded-patches = ""
# Nom affiché « YThibz Music », logo d'origine de YouTube Music.
patcher-args = "-e 'Custom branding' -OcustomName='YThibz Music' -OappIcon=original"
